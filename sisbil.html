
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>Kalkulator Sistem Bilangan</h3>
                    </div>

                    <div class="card-body p-4">
                        <!-- Input bilangan -->
                        <div class="mb-3">
                            <label for="bilangan" class="form-label">
                                Masukkan Bilangan
                            </label>
                            <input
                                type="text"
                                id="bilangan"
                                class="form-control"
                                placeholder="Contoh: 1010"
                            >
                        </div>

                        <!-- Sistem bilangan asal -->
                        <div class="mb-3">
                            <label for="asal" class="form-label">
                                Sistem Bilangan Input
                            </label>
                            <select id="asal" class="form-select">
                                <option value="2">Biner (Basis 2)</option>
                                <option value="8">Oktal (Basis 8)</option>
                                <option value="10" selected>
                                    Desimal (Basis 10)
                                </option>
                                <option value="16">
                                    Heksadesimal (Basis 16)
                                </option>
                            </select>
                        </div>

                        <!-- Sistem bilangan tujuan -->
                        <div class="mb-3">
                            <label for="tujuan" class="form-label">
                                Konversi Ke
                            </label>
                            <select id="tujuan" class="form-select">
                                <option value="2">Biner (Basis 2)</option>
                                <option value="8">Oktal (Basis 8)</option>
                                <option value="10">Desimal (Basis 10)</option>
                                <option value="16" selected>
                                    Heksadesimal (Basis 16)
                                </option>
                            </select>
                        </div>

                        <!-- Tombol konversi -->
                        <div class="d-grid mb-4">
                            <button
                                type="button"
                                class="btn btn-primary btn-lg"
                                onclick="konversikan()"
                            >
                                Konversi
                            </button>
                        </div>

                        <!-- Hasil konversi -->
                        <div class="text-center border rounded p-3 bg-light">
                            <label class="form-label text-muted">
                                Hasil Konversi
                            </label>
                            <div
                                id="hasil"
                                class="fs-2 fw-bold text-primary"
                                aria-live="polite"
                            >
                                -
                            </div>
                            <div
                                id="pesan"
                                class="text-danger mt-2"
                                role="alert"
                            ></div>
                        </div>
                    </div>

                    <div class="card-footer text-center text-muted">
                        Biner | Oktal | Desimal | Heksadesimal
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function konversikan() {
            const bilangan = document
                .getElementById("bilangan")
                .value.trim();

            const asal = parseInt(
                document.getElementById("asal").value
            );

            const tujuan = parseInt(
                document.getElementById("tujuan").value
            );

            const hasilElement = document.getElementById("hasil");
            const pesanElement = document.getElementById("pesan");

            hasilElement.textContent = "-";
            pesanElement.textContent = "";

            if (bilangan === "") {
                pesanElement.textContent =
                    "Silakan masukkan bilangan terlebih dahulu.";
                return;
            }

            // Validasi digit berdasarkan sistem bilangan asal
            const pola = {
                2: /^[01]+$/,
                8: /^[0-7]+$/,
                10: /^[0-9]+$/,
                16: /^[0-9a-fA-F]+$/
            };

            if (!pola[asal].test(bilangan)) {
                pesanElement.textContent =
                    "Bilangan tidak valid untuk sistem bilangan yang dipilih.";
                return;
            }

            // Konversi ke nilai desimal
            const nilaiDesimal = parseInt(bilangan, asal);

            if (!Number.isSafeInteger(nilaiDesimal)) {
                pesanElement.textContent =
                    "Bilangan terlalu besar untuk diproses dengan aman.";
                return;
            }

            // Konversi ke sistem bilangan tujuan
            const hasil = nilaiDesimal
                .toString(tujuan)
                .toUpperCase();

            hasilElement.textContent = hasil;
        }
    </script>

</body>
</html>
