
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Calculator - Number System</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #58bce9;
    font-family: 'Press Start 2P', cursive;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
    overflow-x: hidden;
    position: relative;
}

/* BACKGROUND AWAN */

.cloud {
    position: fixed;
    width: 100px;
    height: 25px;
    background: white;
    box-shadow:
        15px -15px white,
        40px -15px white,
        65px 0 white,
        15px 8px #d9efff,
        40px 8px #d9efff,
        65px 8px #b7dcf5;
    z-index: 0;
    animation: moveCloud 35s linear infinite;
}

.cloud:nth-child(1) {
    top: 12%;
    left: 4%;
}

.cloud:nth-child(2) {
    top: 25%;
    right: 10%;
    transform: scale(1.3);
}

.cloud:nth-child(3) {
    top: 65%;
    left: 25%;
    transform: scale(.8);
}

.cloud:nth-child(4) {
    top: 45%;
    right: 24%;
    transform: scale(1.2);
}

.cloud:nth-child(5) {
    top: 8%;
    right: 30%;
    transform: scale(1.5);
}

.cloud:nth-child(6) {
    top: 75%;
    right: 5%;
}

@keyframes moveCloud {
    0% { translate: -10px 0; }
    50% { translate: 25px 0; }
    100% { translate: -10px 0; }
}

/* CONTAINER */

.container {
    width: 100%;
    max-width: 545px;
    background: #fff5d8;
    border: 6px solid #60320d;
    padding: 25px;
    box-shadow: 10px 10px 0 #333;
    position: relative;
    z-index: 2;
}

/* HEADER */

.header {
    background: #ed382d;
    border: 4px solid #78360f;
    padding: 30px 10px;
    text-align: center;
    color: white;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 17px;
    line-height: 1.8;
}

.header p {
    font-size: 9px;
    margin-top: 12px;
}

/* IKON MARIO */

.icons {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 25px 0;
    font-size: 27px;
}

.icons span {
    transition: .2s;
}

.icons span:hover {
    transform: scale(1.3) rotate(10deg);
}

/* INPUT */

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 11px;
    color: #673b1c;
    margin-bottom: 13px;
}

input, select {
    width: 100%;
    padding: 15px;
    background: white;
    border: 3px solid #693609;
    outline: none;
    font-family: inherit;
    font-size: 10px;
    color: #60320d;
}

input:focus, select:focus {
    border-color: #ed382d;
}

input::placeholder {
    color: #999;
}

/* TOMBOL */

button {
    width: 100%;
    padding: 20px 10px;
    margin-top: 12px;
    border: 3px solid #63370d;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    transition: .15s;
}

.hitung {
    background: #35b34c;
    color: white;
    box-shadow: 0 5px 0 #28752f;
}

.hitung:hover {
    background: #27983c;
    transform: translateY(2px);
    box-shadow: 0 3px 0 #28752f;
}

.reset {
    background: #ffcc35;
    color: #663b0e;
    box-shadow: 0 5px 0 #a77c19;
}

.reset:hover {
    background: #ffdc61;
    transform: translateY(2px);
    box-shadow: 0 3px 0 #a77c19;
}

/* HASIL */

.hasil-box {
    display: none;
    background: #e1f9db;
    border: 3px dashed #35a64b;
    padding: 20px 12px;
    margin-top: 25px;
    color: #28752f;
    text-align: center;
}

.hasil-box h3 {
    font-size: 11px;
    margin-bottom: 18px;
}

.hasil-box p {
    font-size: 9px;
    line-height: 2.5;
    overflow-wrap: anywhere;
}

#hasil {
    font-size: 19px;
    line-height: 2;
    overflow-wrap: anywhere;
    margin-bottom: 12px;
    color: #16852e;
}

/* KEMBALI */

.back {
    display: block;
    text-decoration: none;
    text-align: center;
    background: #e6b735;
    color: #60320d;
    border: 3px solid #63370d;
    box-shadow: 0 5px 0 #a77c19;
    padding: 17px 8px;
    margin-top: 25px;
    font-size: 10px;
    transition: .2s;
}

.back:hover {
    background: #ffda62;
    transform: translateY(2px);
    box-shadow: 0 3px 0 #a77c19;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 30px;
    color: #78451d;
    font-size: 9px;
    line-height: 2.5;
}

/* RESPONSIVE */

@media (max-width: 500px) {
    .container {
        padding: 18px;
    }

    .header h1 {
        font-size: 13px;
    }

    .header p {
        font-size: 7px;
    }

    label {
        font-size: 9px;
    }

    input, select, button {
        font-size: 9px;
    }

    .footer {
        font-size: 7px;
    }
}
</style>
</head>

<body>

<!-- AWAN BACKGROUND -->

<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

<!-- KALKULATOR -->

<div class="container">

    <div class="header">
        <h1>PIXEL CALCULATOR</h1>
        <p>NUMBER SYSTEM GAME</p>
    </div>

    <!-- IKON MARIO -->

    <div class="icons">
        <span>🍄</span>
        <span>🪙</span>
        <span>⭐</span>
        <span>🧱</span>
    </div>

    <!-- INPUT ANGKA -->

    <div class="input-group">
        <label>MASUKKAN BILANGAN</label>
        <input
            type="text"
            id="angka"
            placeholder="Masukkan angka..."
            autocomplete="off"
        >
    </div>

    <!-- BASIS ASAL -->

    <div class="input-group">
        <label>DARI SISTEM BILANGAN</label>

        <select id="dari">
            <option value="2">Biner (Basis 2)</option>
            <option value="8">Oktal (Basis 8)</option>
            <option value="10" selected>Desimal (Basis 10)</option>
            <option value="16">Heksadesimal (Basis 16)</option>
        </select>
    </div>

    <!-- BASIS TUJUAN -->

    <div class="input-group">
        <label>KE SISTEM BILANGAN</label>

        <select id="ke">
            <option value="2">Biner (Basis 2)</option>
            <option value="8">Oktal (Basis 8)</option>
            <option value="10">Desimal (Basis 10)</option>
            <option value="16" selected>Heksadesimal (Basis 16)</option>
        </select>
    </div>

    <!-- TOMBOL -->

    <button class="hitung" onclick="konversi()">
        ▶ HITUNG HASIL
    </button>

    <button class="reset" onclick="resetGame()">
        ↻ RESET GAME
    </button>

    <!-- HASIL -->

    <div class="hasil-box" id="hasilBox">

        <h3>⭐ HASIL KONVERSI ⭐</h3>

        <div id="hasil">?</div>

        <p id="rumus"></p>

    </div>

    <!-- KEMBALI -->

    <a href="tugas.html#bukti" class="back">
        ◀ KEMBALI KE BUKTI BELAJAR
    </a>

    <!-- FOOTER -->

    <div class="footer">
        🌸 SITI AFRILIANI ROSIPAH 🌸
        <br>
        262505004
    </div>

</div>

<script>

// FUNGSI KONVERSI SISTEM BILANGAN

function konversi() {

    let angka = document.getElementById("angka").value.trim();

    let dari = Number(document.getElementById("dari").value);

    let ke = Number(document.getElementById("ke").value);

    if (angka === "") {
        alert("Masukkan bilangan terlebih dahulu!");
        return;
    }

    // Memeriksa format bilangan

    let pola = {
        2: /^-?[01]+$/,
        8: /^-?[0-7]+$/,
        10: /^-?[0-9]+$/,
        16: /^-?[0-9a-fA-F]+$/
    };

    if (!pola[dari].test(angka)) {
        alert("Angka tidak sesuai dengan sistem bilangan asal!");
        return;
    }

    try {

        // Mengubah bilangan menjadi desimal

        let nilai = BigInt(parseInt(angka[0] === "-" ? angka.slice(1) : angka, dari));

        if (angka.startsWith("-")) {
            nilai = -nilai;
        }

        // Mengubah ke basis tujuan

        let hasil = nilai.toString(ke).toUpperCase();

        // Menentukan nama sistem bilangan

        let nama = {
            2: "Biner",
            8: "Oktal",
            10: "Desimal",
            16: "Heksadesimal"
        };

        // Menampilkan hasil

        document.getElementById("hasil").innerHTML = hasil;

        document.getElementById("rumus").innerHTML =
            "DARI: " + nama[dari] +
            "<br>" +
            "KE: " + nama[ke] +
            "<br><br>" +
            "HASIL KONVERSI: " + hasil;

        document.getElementById("hasilBox").style.display = "block";

    } catch (error) {

        alert("Terjadi kesalahan dalam konversi!");

    }
}

// FUNGSI RESET

function resetGame() {

    document.getElementById("angka").value = "";

    document.getElementById("dari").value = "10";

    document.getElementById("ke").value = "16";

    document.getElementById("hasilBox").style.display = "none";

}

</script>

</body>
</html>
