
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siti Afriliani Rosipah - 262505004 - Modular Calculator</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Press Start 2P', cursive;
    background: #5cbbf5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 12px;
    color: #333;
}

.container {
    width: 100%;
    max-width: 435px;
    background: #fff5d6;
    border: 6px solid #663300;
    box-shadow: 9px 9px 0 #333;
    padding: 20px;
}

.header {
    background: #e83c32;
    color: white;
    text-align: center;
    padding: 20px 5px;
    border: 4px solid #663300;
    margin-bottom: 20px;
    line-height: 2;
}

.header h1 {
    font-size: 14px;
}

.header p {
    font-size: 8px;
    margin-top: 5px;
}

.decoration {
    display: flex;
    justify-content: space-around;
    font-size: 25px;
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 10px;
    margin-bottom: 10px;
    color: #633b17;
}

input {
    width: 100%;
    padding: 14px;
    border: 3px solid #663300;
    background: white;
    font-family: inherit;
    font-size: 12px;
    outline: none;
}

input:focus {
    border-color: #e83c32;
}

button {
    width: 100%;
    padding: 15px;
    border: 3px solid #663300;
    font-family: inherit;
    font-size: 10px;
    cursor: pointer;
}

.calculate {
    background: #38b54a;
    color: white;
    box-shadow: 0 5px #176c2a;
    margin-top: 3px;
}

.calculate:hover {
    background: #2b963b;
}

.reset {
    background: #ffcf35;
    color: #663300;
    margin-top: 12px;
}

.result {
    background: #d5f5c7;
    border: 3px dashed #36913d;
    padding: 20px 10px;
    margin-top: 20px;
    text-align: center;
    display: none;
    line-height: 2.5;
    overflow-wrap: anywhere;
}

.result h3 {
    font-size: 11px;
    color: #176c2a;
    margin-bottom: 12px;
}

.result p {
    font-size: 10px;
}

.result strong {
    font-size: 22px;
    color: #e83c32;
}

.history {
    margin-top: 20px;
    background: white;
    border: 3px solid #663300;
    padding: 15px;
}

.history h3 {
    font-size: 10px;
    margin-bottom: 12px;
}

.history ul {
    list-style: none;
    font-size: 9px;
    line-height: 2.5;
    overflow-wrap: anywhere;
}

.footer {
    text-align: center;
    font-size: 8px;
    margin-top: 20px;
    line-height: 2;
    color: #663300;
}

@media(max-width: 400px) {
    .container {
        padding: 13px;
    }

    .header h1 {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>PIXEL CALCULATOR</h1>
        <p>SUPER MODULAR GAME</p>
    </div>

    <div class="decoration">
        <span>🍄</span>
        <span>🪙</span>
        <span>⭐</span>
        <span>🧱</span>
    </div>

    <div class="input-group">
        <label>BILANGAN (a)</label>
        <input type="number" id="angka"
        placeholder="Masukkan bilangan a"
        step="1">
    </div>

    <div class="input-group">
        <label>MODULUS (m)</label>
        <input type="number" id="modulus"
        placeholder="Masukkan modulus m"
        step="1">
    </div>

    <button class="calculate" onclick="hitung()">
        ▶ HITUNG HASIL
    </button>

    <button class="reset" onclick="resetKalkulator()">
        ↻ RESET GAME
    </button>

    <div class="result" id="result">
        <h3>⭐ LEVEL COMPLETED ⭐</h3>

        <p id="rumus"></p>

        <p>HASIL MODULAR:</p>

        <strong id="hasil"></strong>
    </div>

    <div class="footer">
        🍄 SITI AFRILIANI ROSIPAH 🍄
        <br>
        262505004
    </div>

</div>

<script>

function hitung() {

    let aInput = document.getElementById("angka").value;
    let mInput = document.getElementById("modulus").value;

    if (aInput === "" || mInput === "") {
        alert("Masukkan bilangan a dan modulus m!");
        return;
    }

    let a = Number(aInput);
    let m = Number(mInput);

    if (!Number.isSafeInteger(a) ||
        !Number.isSafeInteger(m)) {
        alert("Masukkan bilangan bulat yang valid!");
        return;
    }

    if (m <= 0) {
        alert("Modulus harus lebih besar dari 0!");
        return;
    }

    // Menghitung aritmatika modular
    let hasil = ((a % m) + m) % m;

    let rumus = `${a} mod ${m}`;

    // Menampilkan hasil
    document.getElementById("result").style.display = "block";

    document.getElementById("rumus").innerText =
        rumus;

    document.getElementById("hasil").innerText =
        hasil;
}

function resetKalkulator() {

    document.getElementById("angka").value = "";

    document.getElementById("modulus").value = "";

    document.getElementById("result").style.display = "none";

}

</script>

</body>
</html>
