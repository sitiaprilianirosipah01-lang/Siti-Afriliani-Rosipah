
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siti Afriliani Rosipah - 262505004 - Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Press Start 2P', cursive;
    background: #55b9ed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 15px;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND LANGIT
========================= */

.sky {
    position: fixed;
    inset: 0;
    background: linear-gradient(
        to bottom,
        #55b9ed,
        #65c5f7
    );
    overflow: hidden;
    z-index: -1;
}

/* Awan pixel */

.cloud {
    position: absolute;
    width: 65px;
    height: 20px;
    background: white;
    box-shadow:
        0 5px 0 #dcecff,
        0 10px 0 #b9d8f5,
        10px -10px 0 white,
        10px -15px 0 white,
        25px -20px 0 white,
        25px -15px 0 white,
        40px -10px 0 white,
        40px -5px 0 white,
        50px 0 0 white,
        50px 5px 0 #dcecff,
        60px 10px 0 #b9d8f5;
    image-rendering: pixelated;
    animation: cloudMove 30s linear infinite;
}

/* Posisi awan */

.cloud:nth-child(1) {
    top: 10%;
    left: -100px;
    transform: scale(1.2);
    animation-duration: 35s;
}

.cloud:nth-child(2) {
    top: 22%;
    left: 20%;
    transform: scale(0.7);
    animation-duration: 45s;
}

.cloud:nth-child(3) {
    top: 15%;
    left: 65%;
    transform: scale(1.5);
    animation-duration: 38s;
}

.cloud:nth-child(4) {
    top: 35%;
    left: 85%;
    transform: scale(0.9);
    animation-duration: 42s;
}

.cloud:nth-child(5) {
    top: 48%;
    left: 5%;
    transform: scale(1.4);
    animation-duration: 50s;
}

.cloud:nth-child(6) {
    top: 55%;
    left: 75%;
    transform: scale(1.1);
    animation-duration: 36s;
}

.cloud:nth-child(7) {
    top: 70%;
    left: 25%;
    transform: scale(0.8);
    animation-duration: 44s;
}

.cloud:nth-child(8) {
    top: 80%;
    left: 60%;
    transform: scale(1.3);
    animation-duration: 40s;
}

.cloud:nth-child(9) {
    top: 5%;
    left: 90%;
    transform: scale(0.8);
    animation-duration: 48s;
}

.cloud:nth-child(10) {
    top: 65%;
    left: 95%;
    transform: scale(0.7);
    animation-duration: 39s;
}

@keyframes cloudMove {
    from {
        translate: -30px 0;
    }

    to {
        translate: 100px 0;
    }
}

/* =========================
   KALKULATOR
========================= */

.container {
    width: 100%;
    max-width: 540px;
    background: #fff5d6;
    border: 6px solid #663300;
    box-shadow: 10px 10px 0 #333;
    padding: 25px;
    position: relative;
    z-index: 2;
}

/* Header */

.header {
    background: #e83c32;
    color: white;
    text-align: center;
    padding: 25px 10px;
    border: 4px solid #663300;
    margin-bottom: 25px;
    line-height: 2;
}

.header h1 {
    font-size: 17px;
}

.header p {
    font-size: 9px;
    margin-top: 8px;
}

/* Dekorasi Mario */

.decoration {
    display: flex;
    justify-content: space-around;
    font-size: 30px;
    margin-bottom: 25px;
}

/* Input */

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 11px;
    margin-bottom: 12px;
    color: #633b17;
}

input {
    width: 100%;
    padding: 15px;
    border: 4px solid #663300;
    background: white;
    font-family: inherit;
    font-size: 12px;
    outline: none;
}

input:focus {
    border-color: #e83c32;
}

/* Tombol */

button {
    width: 100%;
    padding: 18px;
    border: 4px solid #663300;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    transition: 0.15s;
}

.calculate {
    background: #38b54a;
    color: white;
    box-shadow: 0 5px #176c2a;
    margin-top: 5px;
}

.calculate:hover {
    background: #2b963b;
    transform: translateY(2px);
    box-shadow: 0 3px #176c2a;
}

.reset {
    background: #ffcf35;
    color: #663300;
    margin-top: 15px;
}

.reset:hover {
    background: #f2b900;
}

/* Hasil */

.result {
    background: #d5f5c7;
    border: 4px dashed #36913d;
    padding: 22px 12px;
    margin-top: 25px;
    text-align: center;
    display: none;
    line-height: 2.5;
    overflow-wrap: anywhere;
}

.result h3 {
    font-size: 11px;
    color: #176c2a;
    margin-bottom: 15px;
}

.result p {
    font-size: 10px;
}

.result strong {
    font-size: 25px;
    color: #e83c32;
}

/* Footer */

.footer {
    text-align: center;
    font-size: 9px;
    margin-top: 25px;
    line-height: 2.5;
    color: #663300;
}

/* Responsif */

@media(max-width: 480px) {
    .container {
        padding: 15px;
    }

    .header h1 {
        font-size: 13px;
    }

    label {
        font-size: 9px;
    }

    button {
        font-size: 9px;
    }

    .footer {
        font-size: 7px;
    }
}

</style>
</head>

<body>

<!-- BACKGROUND AWAN -->
<div class="sky">

    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>

</div>

<!-- KALKULATOR -->
<div class="container">

    <div class="header">
        <h1>PIXEL CALCULATOR</h1>
        <p>SUPER MODULAR GAME</p>
    </div>

    <!-- ICON MARIO -->
    <div class="decoration">
        <span>🍄</span>
        <span>🪙</span>
        <span>⭐</span>
        <span>🧱</span>
    </div>

    <!-- INPUT ANGKA -->
    <div class="input-group">

        <label>BILANGAN (a)</label>

        <input
            type="number"
            id="angka"
            placeholder="Masukkan bilangan a"
            step="1"
        >

    </div>

    <!-- INPUT MODULUS -->
    <div class="input-group">

        <label>MODULUS (m)</label>

        <input
            type="number"
            id="modulus"
            placeholder="Masukkan modulus m"
            step="1"
        >

    </div>

    <!-- BUTTON HITUNG -->
    <button class="calculate" onclick="hitung()">
        ▶ HITUNG HASIL
    </button>

    <!-- BUTTON RESET -->
    <button class="reset" onclick="resetKalkulator()">
        ↻ RESET GAME
    </button>

    <!-- HASIL -->
    <div class="result" id="result">

        <h3>⭐ LEVEL COMPLETED ⭐</h3>

        <p id="rumus"></p>

        <p>HASIL MODULAR:</p>

        <strong id="hasil"></strong>

    </div>

    <!-- FOOTER -->
    <div class="footer">

        🍄 SITI AFRILIANI ROSIPAH 🍄

        <br>

        262505004

    </div>

</div>

<!-- JAVASCRIPT -->
<script>

function hitung() {

    let aInput = document.getElementById("angka").value;
    let mInput = document.getElementById("modulus").value;

    // Validasi input
    if (aInput === "" || mInput === "") {

        alert("Masukkan bilangan a dan modulus m!");

        return;
    }

    let a = Number(aInput);
    let m = Number(mInput);

    // Validasi bilangan bulat
    if (
        !Number.isSafeInteger(a) ||
        !Number.isSafeInteger(m)
    ) {

        alert("Masukkan bilangan bulat yang valid!");

        return;
    }

    // Validasi modulus
    if (m <= 0) {

        alert("Modulus harus lebih besar dari 0!");

        return;
    }

    // Rumus aritmatika modular
    let hasil = ((a % m) + m) % m;

    // Menampilkan hasil
    document.getElementById("result").style.display = "block";

    document.getElementById("rumus").innerText =
        `${a} mod ${m}`;

    document.getElementById("hasil").innerText =
        hasil;

}

// Fungsi reset
function resetKalkulator() {

    document.getElementById("angka").value = "";

    document.getElementById("modulus").value = "";

    document.getElementById("result").style.display = "none";

}

</script>

</body>
</html>
