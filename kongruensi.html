<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Kongruensi - Mario Pixel</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: 'Press Start 2P', cursive;
    background: linear-gradient(#55b9ed, #65c5f7);
    overflow-x: hidden;
    padding: 40px 15px;
}

/* AWAN PIXEL */
.cloud {
    position: fixed;
    width: 100px;
    height: 35px;
    background: white;
    border-radius: 20px;
    box-shadow:
        20px -15px white,
        45px -10px white,
        65px 0 white,
        15px 10px #dcecff;
    opacity: 0.9;
    animation: moveCloud linear infinite;
    z-index: -1;
}

.cloud:nth-child(1) {
    top: 10%;
    animation-duration: 35s;
}

.cloud:nth-child(2) {
    top: 25%;
    animation-duration: 45s;
    animation-delay: -10s;
}

.cloud:nth-child(3) {
    top: 45%;
    animation-duration: 40s;
    animation-delay: -20s;
}

.cloud:nth-child(4) {
    top: 65%;
    animation-duration: 50s;
    animation-delay: -15s;
}

.cloud:nth-child(5) {
    top: 85%;
    animation-duration: 38s;
    animation-delay: -5s;
}

@keyframes moveCloud {
    from {
        left: -180px;
    }
    to {
        left: 110%;
    }
}

/* CONTAINER */
.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    background: #fff5d6;
    border: 6px solid #663300;
    box-shadow: 8px 8px #333;
    padding: 25px;
    border-radius: 8px;
}

/* HEADER */
.header {
    background: #e83c32;
    color: white;
    text-align: center;
    padding: 22px 10px;
    border: 4px solid #663300;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 17px;
    line-height: 1.8;
}

.header p {
    font-size: 9px;
    margin-top: 12px;
    line-height: 1.8;
}

/* DEKORASI */
.mario {
    text-align: center;
    font-size: 45px;
    margin-bottom: 20px;
}

/* INPUT */
.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 10px;
    margin-bottom: 12px;
    color: #663300;
}

input {
    width: 100%;
    padding: 15px;
    font-family: Arial, sans-serif;
    font-size: 18px;
    border: 3px solid #663300;
    border-radius: 5px;
    background: white;
    outline: none;
}

input:focus {
    border-color: #2879d0;
}

/* TOMBOL */
.buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

button {
    flex: 1;
    padding: 15px 8px;
    font-family: 'Press Start 2P', cursive;
    font-size: 9px;
    border: 3px solid #663300;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 5px #333;
    transition: 0.15s;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 1px #333;
}

.hitung {
    background: #38b54a;
    color: white;
}

.reset {
    background: #ffcf35;
    color: #663300;
}

/* HASIL */
.result {
    display: none;
    margin-top: 28px;
    padding: 20px;
    background: #e4f5d7;
    border: 3px dashed #38a34a;
    border-radius: 5px;
    line-height: 2;
    overflow-wrap: anywhere;
}

.result h3 {
    font-size: 12px;
    color: #2879d0;
    margin-bottom: 18px;
}

.result p {
    font-family: Arial, sans-serif;
    font-size: 17px;
    margin-bottom: 12px;
    line-height: 1.7;
    color: #333;
}

.status {
    font-family: 'Press Start 2P', cursive !important;
    font-size: 10px !important;
    margin-top: 15px;
    color: #2879d0 !important;
}

/* PENJELASAN */
.info {
    margin-top: 25px;
    padding: 15px;
    background: #fff;
    border: 3px solid #663300;
    font-size: 9px;
    line-height: 2.2;
    color: #663300;
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 8px;
    color: #663300;
    line-height: 2;
}

/* RESPONSIVE */
@media (max-width: 500px) {
    .container {
        padding: 15px;
    }

    .header h1 {
        font-size: 12px;
    }

    button {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<!-- AWAN -->
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

<div class="container">

    <div class="header">
        <h1>KALKULATOR KONGRUENSI</h1>
        <p>SUPER MARIO PIXEL GAME</p>
    </div>

    <div class="mario">🍄 ⭐ 🍄</div>

    <div class="form-group">
        <label>MASUKKAN NILAI A</label>
        <input type="number" id="nilaiA"
        placeholder="Contoh: 17">
    </div>

    <div class="form-group">
        <label>MASUKKAN NILAI B</label>
        <input type="number" id="nilaiB"
        placeholder="Contoh: 5">
    </div>

    <div class="form-group">
        <label>MASUKKAN MODULUS (M)</label>
        <input type="number" id="modulus"
        placeholder="Contoh: 6">
    </div>

    <div class="buttons">
        <button class="hitung" onclick="hitungKongruensi()">
            HITUNG
        </button>

        <button class="reset" onclick="resetKalkulator()">
            RESET
        </button>
    </div>

    <div class="result" id="hasil">
        <h3>HASIL PERHITUNGAN</h3>
        <p id="persamaan"></p>
        <p id="sisaA"></p>
        <p id="sisaB"></p>
        <p id="selisih"></p>
        <p id="kesimpulan" class="status"></p>
    </div>

    <div class="info">
        CARA KERJA:<br>
        Kongruensi adalah hubungan dua bilangan
        yang memiliki sisa pembagian sama.<br><br>

        Rumus:<br>
        A ≡ B (mod M)<br><br>

        Syarat:<br>
        (A - B) habis dibagi M.
    </div>

    <div class="footer">
        🍄 MARIO MATHEMATICS GAME 🍄<br>
        HAVE FUN LEARNING!
    </div>

</div>

<script>
function hitungKongruensi() {

    let a = Number(document.getElementById("nilaiA").value);
    let b = Number(document.getElementById("nilaiB").value);
    let m = Number(document.getElementById("modulus").value);

    let hasil = document.getElementById("hasil");

    if (
        document.getElementById("nilaiA").value === "" ||
        document.getElementById("nilaiB").value === "" ||
        document.getElementById("modulus").value === ""
    ) {
        alert("Silakan isi semua nilai terlebih dahulu!");
        return;
    }

    if (
        !Number.isSafeInteger(a) ||
        !Number.isSafeInteger(b) ||
        !Number.isSafeInteger(m)
    ) {
        alert("Masukkan bilangan bulat yang valid!");
        return;
    }

    if (m <= 0) {
        alert("Modulus harus lebih besar dari 0!");
        return;
    }

    // Menghitung sisa pembagian
    let sisa1 = ((a % m) + m) % m;
    let sisa2 = ((b % m) + m) % m;

    // Menghitung selisih
    let selisih = a - b;

    // Mengecek kongruensi
    let kongruen = sisa1 === sisa2;

    document.getElementById("persamaan").innerHTML =
        `${a} ≡ ${b} (mod ${m})`;

    document.getElementById("sisaA").innerHTML =
        `Sisa A = ${a} mod ${m} = ${sisa1}`;

    document.getElementById("sisaB").innerHTML =
        `Sisa B = ${b} mod ${m} = ${sisa2}`;

    document.getElementById("selisih").innerHTML =
        `A - B = ${selisih}<br>` +
        `Selisih mod ${m} = ${((selisih % m) + m) % m}`;

    if (kongruen) {
        document.getElementById("kesimpulan").innerHTML =
            "✓ KONGRUEN!";
        document.getElementById("kesimpulan").style.color =
            "#229b42";
    } else {
        document.getElementById("kesimpulan").innerHTML =
            "✗ TIDAK KONGRUEN!";
        document.getElementById("kesimpulan").style.color =
            "#e83c32";
    }

    hasil.style.display = "block";
}

function resetKalkulator() {

    document.getElementById("nilaiA").value = "";
    document.getElementById("nilaiB").value = "";
    document.getElementById("modulus").value = "";

    document.getElementById("hasil").style.display = "none";
}
</script>

</body>
</html>
